<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maximilian Muller</title>
  <style>
    body {
      margin: 0;
      background: #fdfdfc;
      color: #171716;
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      box-sizing: border-box;
      min-block-size: 100vh;
      min-block-size: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 1.06;
    }

    h1 span {
      display: block;
      margin-block-end: 0.2em;
      font-size: 0.47em;
      font-weight: 550;
      letter-spacing: -0.035em;
    }
  </style>
</head>
<body>
  <main>
    <h1><span>I'm</span> Maximilian Muller</h1>
  </main>
</body>
</html>
